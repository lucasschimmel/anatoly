[package]
name = "anatoly"
version = "0.2.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/lucasschimmel/anatoly"
readme = "README.md"
keywords = ["php", "security", "cli", "scanner"]
categories = ["command-line-utilities"]
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/FLAGS.md", "/MODES.md", "/OFFLINE-MODES.md", "/PUBLIC-DETECTION.md", "/AUDIT-CONTROLS.md", "/EXEGOL.md", "/wordlists/anatoly-core.txt"]
description = "Evidence-based PHP2Shell exposure assessment for PHP applications"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
x509-parser = { version = "0.18", default-features = false }

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"
